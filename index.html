<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cabaran Tarik Tali Sains Tahun 6 (IFP Dual Player)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a252f;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BAHAGIAN ATAS: ROPE / TUG OF WAR DISPLAY */
        #game-arena {
            height: 35vh;
            background: linear-gradient(to bottom, #87CEEB 60%, #5D9236 60%);
            position: relative;
            border-bottom: 5px solid #2c3e50;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .flag-line {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            height: 80px;
            width: 4px;
            background-color: #e74c3c;
            z-index: 10;
        }

        .flag-label {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        #rope-container {
            position: absolute;
            top: 65%;
            width: 80%;
            height: 20px;
            display: flex;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .rope {
            width: 100%;
            height: 12px;
            background: repeating-linear-gradient(45deg, #d35400, #d35400 10px, #e67e22 10px, #e67e22 20px);
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .marker-flag {
            position: absolute;
            left: 50%;
            top: -15px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #f1c40f;
        }

        .character {
            position: absolute;
            font-size: 3.5rem;
            top: -55px;
            transition: transform 0.2s;
        }

        .char-p1 { left: 10%; transform: scaleX(-1); }
        .char-p2 { right: 10%; }

        /* SELEKTOR BAB */
        #chapter-selector {
            height: 7vh;
            background-color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 10px;
        }

        #chapter-selector label {
            font-weight: bold;
            font-size: 1.1rem;
        }

        #chapter-select {
            padding: 6px 12px;
            font-size: 1rem;
            border-radius: 5px;
            border: none;
            background: #ecf0f1;
            font-weight: bold;
            cursor: pointer;
        }

        /* BAHAGIAN BAWAH: SPLIT SCREEN PLAYER 1 & PLAYER 2 */
        #controls-container {
            height: 58vh;
            display: flex;
            width: 100%;
        }

        .player-zone {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        #p1-zone {
            background-color: #2980b9;
            border-right: 4px solid #1a252f;
        }

        #p2-zone {
            background-color: #c0392b;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.95);
            color: #2c3e50;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 18px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 70px;
        }

        .btn-option:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.4);
        }

        /* POPUP PEMENANG */
        #winner-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #winner-modal h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
        }

        .btn-reset {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ARENA TARIK TALI (ATAS IFP) -->
    <div id="game-arena">
        <div class="flag-label">GARIS PENENTU</div>
        <div class="flag-line"></div>
        <div id="rope-container">
            <div class="character char-p1">🤼</div>
            <div class="rope">
                <div class="marker-flag"></div>
            </div>
            <div class="character char-p2">🤼</div>
        </div>
    </div>

    <!-- SELEKTOR BAB SAINS TAHUN 6 -->
    <div id="chapter-selector">
        <label for="chapter-select">PILIH BAB SAINS:</label>
        <select id="chapter-select" onchange="changeChapter()">
            <option value="1">Bab 1: Kemahiran Saintifik</option>
            <option value="2">Bab 2: Manusia (Pembiakan & Saraf)</option>
            <option value="3">Bab 3: Mikroorganisma</option>
            <option value="4">Bab 4: Interaksi Antara Hidupan</option>

            <option value="8">Bab 8: Pengawetan Makanan</option>
            <option value="9">Bab 9: Bahan Buangan</option>
            <option value="10">Bab 10: Gerhana</option>
        </select>
    </div>

    <!-- SPLIT-SCREEN DUAL PLAYER (BAWAH IFP) -->
    <div id="controls-container">
        
        <!-- PEMAIN 1 (KIRI) -->
        <div class="player-zone" id="p1-zone">
            <div class="player-header">
                <span>🔵 PEMAIN 1 (KIRI)</span>
                <span id="p1-score">Mata: 0</span>
            </div>
            <div class="question-box" id="p1-question">Memuatkan soalan...</div>
            <div class="options-grid" id="p1-options"></div>
        </div>

        <!-- PEMAIN 2 (KANAN) -->
        <div class="player-zone" id="p2-zone">
            <div class="player-header">
                <span>🔴 PEMAIN 2 (KANAN)</span>
                <span id="p2-score">Mata: 0</span>
            </div>
            <div class="question-box" id="p2-question">Memuatkan soalan...</div>
            <div class="options-grid" id="p2-options"></div>
        </div>

    </div>

    <!-- MODAL PEMENANG -->
    <div id="winner-modal">
        <h1 id="winnerText">PEMAIN 1 MENANG!</h1>
        <button class="btn-reset" onclick="resetGame()">Main Semula</button>

                { q: "Ciri-ciri makanan yang rosak bagi susu ialah...", options: ["Berbau masam dan berketul-ketul", "Menjadi manis", "Berwarna jernih", "Mengeras"], ans: 0 },
                { q: "Kaedah pendinginan menyimpan makanan pada suhu...", options: ["Rendah (dalam peti ais)", "Sangat tinggi", "Bilik", "Panas terik"], ans: 0 },
                { q: "Kaedah pengetinan dan pembotolan melibatkan proses...", options: ["Pemanasan suhu tinggi untuk membunuh bakteria", "Pembekuan segera", "Penjemuran bawah matahari", "Pemotongan"], ans: 0 },
                { q: "Pengeringan cili merah di bawah sinar matahari bertujuan untuk...", options: ["Menyingkirkan air", "Menambah bau", "Mematikan warna", "Memanjangkan saiz"], ans: 0 }
            ],
            9: [
                { q: "Antara berikut, bahan buangan manakah yang TERBIODEGRADASI?", options: ["Botol plastik", "Sisa makanan", "Tin aluminium", "Cermin kaca"], ans: 1 },
                { q: "Apakah warna tong kitar semula untuk bahan KERTAS?", options: ["Coklat", "Jingga", "Biru", "Hijau"], ans: 2 },
                { q: "Kesan pembuangan sampah tidak teratur boleh menyebabkan...", options: ["Banjir kilat", "Udara segar", "Tanah subur", "Air jernih"], ans: 0 },
                { q: "Bahan buangan tidak terbiodegradasi ialah bahan yang...", options: ["Tidak boleh diuraikan oleh mikroorganisma", "Boleh mereput dengan cepat", "Berasal dari tumbuh-tumbuhan", "Mudah hancur dalam tanah"], ans: 0 },
                { q: "Tong kitar semula berwarna JINGGA adalah untuk...", options: ["Tin aluminium, keluli dan plastik", "Kertas sahaja", "Kaca sahaja", "Sisa makanan"], ans: 0 },
                { q: "Tong kitar semula berwarna COKLAT digunakan untuk mengumpul...", options: ["Kaca", "Plastik", "Kertas", "Sisa toksik"], ans: 0 },
                { q: "Amalan 5R merangkumi Reduce, Reuse, Recycle, Rethink dan...", options: ["Repair", "Remove", "Return", "React"], ans: 0 },
                { q: "Contoh sisa toksik yang berbahaya kepada persekitaran ialah...", options: ["Bateri terpakai dan cecair kimia", "Sisa sayuran", "Surat khabar lama", "Kotak kadbod"], ans: 0 },
                { q: "Pengurusan bahan buangan terancang secara pemprosesan semula dinamakan...", options: ["Kitar semula (Recycle)", "Pembakaran terbuka", "Pembuangan ke sungai", "Penebangan"], ans: 0 },
                { q: "Apakah risiko pembuangan plastik ke dalam laut?", options: ["Menjejaskan kehidupan marin", "Pembersihan air", "Meningkatkan bilangan ikan", "Menstabilkan suhu laut"], ans: 0 }
            ],
            10: [
                { q: "Gerhana Bulan berlaku apabila kedudukan susunan mengikut urutan...", options: ["Matahari - Bumi - Bulan", "Matahari - Bulan - Bumi", "Bumi - Matahari - Bulan", "Bulan - Matahari - Bumi"], ans: 0 },
                { q: "Gerhana berlaku disebabkan sifat cahaya iaitu...", options: ["Cahaya boleh dibiaskan", "Cahaya bergerak lurus", "Cahaya boleh dipantulkan", "Cahaya ada 7 warna"], ans: 1 },
                { q: "Fasa Gerhana Matahari hanya berlaku pada waktu...", options: ["Malam", "Siang", "Tengah malam", "Subuh"], ans: 1 },
                { q: "Gerhana Bulan berlaku pada fasa bulan...", options: ["Bulan purnama", "Bulan sabit", "Bulan separa", "Bulan baru"], ans: 0 },
                { q: "Kawasan bayang-bayang yang GELAP SEPENUHNYA semasa gerhana dinamakan...", options: ["Umbra", "Penumbra", "Atmospere", "Korona"], ans: 0 },
                { q: "Kawasan bayang-bayang yang SEPARA GELAP dinamakan...", options: ["Penumbra", "Umbra", "Sfera", "Orbit"], ans: 0 },
                { q: "Gerhana Matahari berlaku apabila kedudukan susunan mengikut urutan...", options: ["Matahari - Bulan - Bumi", "Matahari - Bumi - Bulan", "Bulan - Matahari - Bumi", "Bumi - Bulan - Matahari"], ans: 0 },
                { q: "Apakah sifat cahaya kedua yang menyebabkan bayang-bayang terhasil semasa gerhana?", options: ["Cahaya tidak boleh menembusi objek gelap", "Cahaya bergerak lambat", "Cahaya mempunyai pelangi", "Cahaya boleh memanas"], ans: 0 },
                { q: "Gerhana Matahari biasanya berlaku dalam tempoh masa yang...", options: ["Singkat (beberapa minit)", "Sangat panjang (berhari-hari)", "Semalaman", "24 jam"], ans: 0 },
                { q: "Mengapakah kita tidak digalakkan melihat Gerhana Matahari secara terus tanpa perlindungan?", options: ["Boleh merosakkan retina mata", "Boleh menyebabkan pekak", "Boleh menyebabkan demam", "Boleh merosakkan kulit"], ans: 0 }
            ]
        };

        // VARIABEL STATE PERMAINAN
        let currentChapter = 1;
        let ropePosition = 0; // 0 = Tengah, -100 (P1 Menang), +100 (P2 Menang)
        let p1Score = 0;
        let p2Score = 0;
        
        let p1CurrentQ = null;
        let p2CurrentQ = null;

        // INITALIZE GAME
        window.onload = () => {
            loadQuestions();
        };

        function changeChapter() {
            currentChapter = document.getElementById("chapter-select").value;
            resetGame();
        }

        function resetGame() {
            ropePosition = 0;
            p1Score = 0;
            p2Score = 0;
            document.getElementById("p1-score").innerText = "Mata: " + p1Score;
            document.getElementById("p2-score").innerText = "Mata: " + p2Score;
            document.getElementById("winner-modal").style.display = "none";
            updateRopeUI();
            loadQuestions();
        }

        function getRandomQuestion() {
            const list = questionBank[currentChapter];
            return list[Math.floor(Math.random() * list.length)];
        }

        function loadQuestions() {
            p1CurrentQ = getRandomQuestion();
            p2CurrentQ = getRandomQuestion();

            renderQuestion(1, p1CurrentQ);
            renderQuestion(2, p2CurrentQ);
        }

        function renderQuestion(playerNum, qData) {
            const qBox = document.getElementById(`p${playerNum}-question`);
            const optGrid = document.getElementById(`p${playerNum}-options`);

            qBox.innerText = qData.q;
            optGrid.innerHTML = "";

            qData.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "btn-option";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(playerNum, index);
                optGrid.appendChild(btn);
            });
        }

        function handleAnswer(playerNum, selectedIndex) {
            const currentQ = (playerNum === 1) ? p1CurrentQ : p2CurrentQ;

            if (selectedIndex === currentQ.ans) {
                // JAWAPAN BETUL: Tarik tali ke pihak pemain
                if (playerNum === 1) {
                    ropePosition -= 15; // Tarik ke kiri
                    p1Score += 10;
                    document.getElementById("p1-score").innerText = "Mata: " + p1Score;
                } else {
                    ropePosition += 15; // Tarik ke kanan
                    p2Score += 10;
                    document.getElementById("p2-score").innerText = "Mata: " + p2Score;
                }
            } else {
                // JAWAPAN SALAH: Penalti, tali tertarik ke pihak lawan
                if (playerNum === 1) {
                    ropePosition += 10;
                } else {
                    ropePosition -= 10;
                }
            }

            updateRopeUI();
            checkWinner();

            // Soalan baru untuk pemain berkenaan
            if (playerNum === 1) {
                p1CurrentQ = getRandomQuestion();
                renderQuestion(1, p1CurrentQ);
            } else {
                p2CurrentQ = getRandomQuestion();
                renderQuestion(2, p2CurrentQ);
            }
        }

        function updateRopeUI() {
            const rope = document.getElementById("rope-container");
            // Limit julat kedudukan
            if (ropePosition < -100) ropePosition = -100;
            if (ropePosition > 100) ropePosition = 100;
            
            rope.style.transform = `translateX(${ropePosition * 2.5}px)`;
        }

        function checkWinner() {
            if (ropePosition <= -90) {
                showWinner("PEMAIN 1 (KIRI) MENANG! 🎉");
            } else if (ropePosition >= 90) {
                showWinner("PEMAIN 2 (KANAN) MENANG! 🎉");
            }
        }

        function showWinner(text) {
            document.getElementById("winnerText").innerText = text;
            document.getElementById("winner-modal").style.display = "flex";
        }
    </script>
</body>
</html>
